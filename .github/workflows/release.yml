name: Release

# A version tag starts the pipeline. The app and DMG are signed ad-hoc, so the
# workflow needs no Apple certificate, notarization key or GitHub secrets.
on:
  push:
    tags: ["*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify tag & run tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release tag
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc|alpha)\.[0-9]+(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./build.sh --test

  release:
    name: Build, ad-hoc sign & package DMG
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve commit
        id: commit
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VORSSAINT_ADHOC_SIGN: "1"
        run: ./build.sh

      - name: Verify ad-hoc signature
        run: |
          APP="build/stage/Vorssaint Coffee.app"
          codesign --verify --deep --strict "$APP"
          SIGNATURE="$(codesign -dvv "$APP" 2>&1)"
          if [[ "$SIGNATURE" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc signature: $APP" >&2
            exit 1
          fi

      - name: Selftest
        run: ./build/VorssaintCoffee --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Sign DMG ad-hoc
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          codesign --force --sign - "$DMG"
          codesign --verify --strict "$DMG"

      - name: Verify DMG
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          SIGNATURE="$(codesign -dvv "$DMG" 2>&1)"
          if [[ "$SIGNATURE" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc signature: $DMG" >&2
            exit 1
          fi
          MP=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MP" >/dev/null 2>&1 || true
            rmdir "$MP" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$DMG"
          APP="$MP/Vorssaint Coffee.app"
          codesign --verify --deep --strict "$APP"
          SIGNATURE="$(codesign -dvv "$APP" 2>&1)"
          if [[ "$SIGNATURE" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc signature: $APP" >&2
            exit 1
          fi

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            NOTES="Release $GITHUB_REF_NAME."
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' "$NOTES"
            echo ""
            echo "This build is ad-hoc signed and not notarized, so macOS asks you to confirm the first launch. Open the .dmg below, drag Vorssaint Coffee to Applications, then allow it in System Settings → Privacy & Security → Open Anyway. Requires macOS 14 or later on Apple Silicon."
          } > "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Stage release artifact
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/release-bundle"
          mkdir -p "$BUNDLE"
          cp dist/*.dmg "$BUNDLE/"
          cp "$NOTES_FILE" "$BUNDLE/release-notes.md"
          (
            cd "$BUNDLE"
            shasum -a 256 ./*.dmg ./release-notes.md > SHA256SUMS
          )

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Create release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Creates the release; this job never receives Apple credentials.
    env:
      GH_REPO: ${{ github.repository }}
      DRAFT: "true" # Set to "false" to publish the release automatically.
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.ref_name }}
          path: release-bundle

      - name: Verify release artifact
        run: |
          set -euo pipefail
          cd release-bundle
          sha256sum -c SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          NOTES_FILE: release-bundle/release-notes.md
        run: |
          set -euo pipefail
          REMOTE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$REMOTE_COMMIT" != "$COMMIT_SHA" ]]; then
            echo "Release tag moved after signing" >&2
            exit 1
          fi

          FILES=(release-bundle/*.dmg)
          if [[ "$GITHUB_REF_NAME" =~ -(beta|rc|alpha) ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          verify_assets() {
            local release_id expected actual
            release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq '.databaseId')"
            expected="$(
              for file in "${FILES[@]}"; do
                printf '%s\tsha256:%s\n' \
                  "$(basename "$file")" \
                  "$(sha256sum "$file" | awk '{print $1}')"
              done | sort
            )"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq '.[] | [.name, .digest] | @tsv' | sort)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Published assets do not match the built artifacts" >&2
              exit 1
            fi
          }

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != "true" ]]; then
              verify_assets
              echo "Release $GITHUB_REF_NAME is already published."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --prerelease="$PRERELEASE"
          verify_assets

          if [[ "$DRAFT" == "true" ]]; then
            echo "Release $GITHUB_REF_NAME left as a draft."
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
          verify_assets
